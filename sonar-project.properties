# Must match the Project Key in SonarQube Cloud exactly
sonar.projectKey=executionkit

# Replace 'YOUR_ORG_KEY' with your actual SonarQube Cloud Organization Key
# (You can find this in SonarQube Cloud under your Organization name in the top right)
sonar.organization=areebaiqball

# Project name and version
sonar.projectName=executionkit
sonar.projectVersion=1.0

# Path to the source code (since it's a Python project, this is usually just '.')
sonar.sources=.

# Exclude test files and build artifacts from analysis
sonar.exclusions=**/tests/**,**/venv/**,**/.venv/**,**/__pycache__/**,**/dist/**,**/build/**

# If you are using Python coverage (pytest/coverage.py), you can point to the report here later
# sonar.python.coverage.reportPaths=coverage.xml

sonar.branch.name=master
sonar.python.coverage.reportPaths=coverage.xml
