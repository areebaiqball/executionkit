name: SonarQube Cloud Analysis

on:
  push:
    branches:
      - main
      - test
      - '**' 
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonar-scan:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Using one of the versions from your CI run

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install your project in editable mode so tests can find 'executionkit'
          pip install -e .

          pip install pytest pytest-cov hypothesis pytest-asyncio
          
          # Install testing tools
          pip install --only-binary=:all: "pytest==8.3.5" "pytest-cov==6.0.0"
          
          # If you have a requirements.txt, you can also uncomment this:
          # pip install -r requirements.txt 

      - name: Run tests with coverage
        run: |
          # Generates a coverage.xml file that SonarQube will read
          pytest --cov=. --cov-report=xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Note: We don't need to pass projectKey here because it reads it from sonar-project.properties
