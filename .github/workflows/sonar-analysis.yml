name: SonarQube Cloud Analysis
on:
  push:
    branches: [ main ] # or master, depending on the repo
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important for better analysis relevancy

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=executionkit
            -Dsonar.organization=areebaiqball_executionkit
            -Dsonar.sources=.
